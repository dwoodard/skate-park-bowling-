<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#131d27"><meta name="apple-mobile-web-app-capable" content="yes"><title>Skatepark Bowling</title><link rel="manifest" href="./manifest.webmanifest"><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111a22;color:#fff;font-family:system-ui,sans-serif;touch-action:none}#game{position:fixed;inset:0;width:100%;height:100%;touch-action:none;display:block}#hud{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;padding:12px;display:flex;justify-content:space-between;pointer-events:none;font-size:13px;font-weight:800;text-shadow:0 2px 5px #000}#tip{position:fixed;bottom:calc(12px + env(safe-area-inset-bottom,0px));left:12px;background:#14212dcc;border:1px solid #ffffff35;padding:9px 11px;border-radius:10px;font-size:12px;pointer-events:none}button{background:#eebd75;color:#241b13;border:0;border-radius:12px;font-weight:900;padding:14px 23px;font-size:16px;cursor:pointer}#retry{position:fixed;bottom:calc(12px + env(safe-area-inset-bottom,0px));right:12px;padding:10px 14px;font-size:12px}#screen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:15px;background:#101b25ed;text-align:center;padding:25px;z-index:5}#screen h1{font-size:clamp(28px,8vw,44px);line-height:1.05;margin:0}#screen p{font-size:14px;color:#c7d3dc;line-height:1.5;max-width:340px;margin:0}#screen small{color:#b9c3cc;overflow-wrap:anywhere}#screen[hidden]{display:none}#count{position:fixed;top:34%;width:100%;text-align:center;font-size:70px;font-weight:900;text-shadow:0 4px 14px #000;pointer-events:none}#steer{position:fixed;bottom:105px;left:50%;transform:translateX(-50%);width:110px;height:5px;border-radius:4px;background:#ffffff30;pointer-events:none;opacity:0}#steer i{position:absolute;left:50%;height:5px;width:18px;border-radius:5px;background:#f5c17b;transform:translateX(-50%)}#boost{color:#ffd58f}
</style></head><body><canvas id="game"></canvas><div id="hud"><span id="level">LEVEL 1</span><span id="version" style="color:#ffd084">BUILD 5</span><span id="score">0 / 10 PINS</span><span id="speed">0 km/h</span></div><div id="count"></div><div id="steer"><i></i></div><div id="tip">DRAG ↔ STEER<br>TAP = BOOST <span id="boost">READY</span></div><button id="retry">RETRY</button><div id="screen"><small>WOODEN SKATEPARK</small><h1>SKATEPARK<br>BOWLING</h1><p>One giant skatepark. New starting positions and pin targets every level. Drag to steer, tap to boost. Gravity provides the speed.</p><button id="play" disabled>LOADING 3D ENGINE…</button><small id="status">Connecting to CDN…</small></div>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id),canvas=$('game'),screen=$('screen'),play=$('play'),status=$('status'),count=$('count');let B,engine,scene,camera,ball,ring,pins=[],phase='loading',level=1,timer=0,runTime=0,px=0,pz=0,vx=0,vz=0,steer=0,steerSmooth=0,cooldown=0,start=[0,-98],goal=[0,-38],last=performance.now(),pointer=null,downX=0,downY=0,downTime=0,moved=false,camLook;
if('serviceWorker' in navigator){navigator.serviceWorker.getRegistrations().then(rs=>rs.forEach(r=>r.unregister())).catch(()=>{})}const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function addScript(url,timeout=11000){return new Promise((resolve,reject)=>{const s=document.createElement('script');let settled=false;const t=setTimeout(()=>{if(!settled){settled=true;s.remove();reject(Error('Timed out'))}},timeout);s.onload=()=>{if(!settled){settled=true;clearTimeout(t);resolve()}};s.onerror=()=>{if(!settled){settled=true;clearTimeout(t);reject(Error('Script blocked or unavailable'))}};s.src=url;document.head.appendChild(s)})}
async function boot(){play.disabled=true;play.textContent='LOADING…';const urls=['https://cdn.babylonjs.com/babylon.js','https://cdnjs.cloudflare.com/ajax/libs/babylonjs/7.54.3/babylon.min.js','https://unpkg.com/babylonjs@7.54.3/babylon.js'];for(let i=0;i<urls.length;i++){try{status.textContent='Loading Babylon.js (source '+(i+1)+' of '+urls.length+')';if(!window.BABYLON?.Engine)await addScript(urls[i]);if(!window.BABYLON?.Engine)throw Error('Engine not found');B=window.BABYLON;init();phase='menu';play.disabled=false;play.textContent='PLAY';status.textContent='Ready to roll';return}catch(e){status.textContent=e.message}}play.disabled=false;play.textContent='RETRY ENGINE LOAD';play.onclick=boot}
function h(x,z){return 29-.19*(z+100)+1.2*Math.sin(z*.095)+.45*Math.sin(z*.2)-3.2*Math.exp(-((x+11)**2/230+(z+36)**2/420))-3.3*Math.exp(-((x-12)**2/250+(z-1)**2/380))+3.7*Math.pow(Math.abs(x)/35,2.6)}
function init(){engine=new B.Engine(canvas,true,{adaptToDeviceRatio:false});engine.setHardwareScalingLevel(Math.max(1,(devicePixelRatio||1)/1.6));scene=new B.Scene(engine);scene.clearColor=new B.Color4(.20,.22,.24,1);camera=new B.FreeCamera('chase',new B.Vector3(0,36,-100),scene);camera.fov=1.08;camera.maxZ=360;camLook=new B.Vector3(0,28,-75);camera.setTarget(camLook);new B.HemisphericLight('ambient',new B.Vector3(0,1,0),scene).intensity=.65;const sun=new B.DirectionalLight('sun',new B.Vector3(-.3,-1,.45),scene);sun.intensity=.65;
const mat=(name,color)=>{let m=new B.StandardMaterial(name,scene);m.diffuseColor=B.Color3.FromHexString(color);return m},wood=mat('plywood','#aa7947'),dark=mat('wood trim','#654329'),steel=mat('coping','#a1a7aa'),white=mat('pin white','#f5f3ec'),red=mat('pin stripe','#c33b31'),blue=mat('ball blue','#233d61'),gold=mat('target','#f5cb78');
function box(name,w,hh,d,x,y,z,m){const o=B.MeshBuilder.CreateBox(name,{width:w,height:hh,depth:d},scene);o.position.set(x,y,z);o.material=m;return o}
const terrain=new B.Mesh('park',scene),v=[],ix=[],norm=[],NX=70,NZ=175;for(let j=0;j<=NZ;j++)for(let i=0;i<=NX;i++){const x=-38+76*i/NX,z=-110+220*j/NZ;v.push(x,h(x,z),z)}for(let j=0;j<NZ;j++)for(let i=0;i<NX;i++){const a=j*(NX+1)+i,c=a+NX+1;ix.push(a,a+1,c,a+1,c+1,c)}B.VertexData.ComputeNormals(v,ix,norm);const vd=new B.VertexData();vd.positions=v;vd.indices=ix;vd.normals=norm;vd.applyToMesh(terrain);terrain.material=wood;wood.backFaceCulling=false;wood.disableLighting=true;wood.emissiveColor=B.Color3.FromHexString('#76502d');wood.specularColor=new B.Color3(0,0,0);
for(let z=-105;z<=105;z+=13)for(let x=-33;x<=33;x+=12)box('plywood joint',10,.025,.06,x,h(x,z)+.09,z,dark);const stripeMat=mat('test dark walnut','#412713');stripeMat.disableLighting=true;stripeMat.emissiveColor=B.Color3.FromHexString('#412713');for(let z=-98;z<95;z+=22)for(let x=-30;x<=30;x+=10){box('build5 contrasting plywood strip',8,.09,.55,x,h(x,z)+.18,z,stripeMat)}
for(let x of [-39,39])for(let z=-104;z<=104;z+=12){box('quarterpipe wall',1.4,3,11,x,h(x>0?37:-37,z)+1.3,z,dark);box('steel coping',.22,.15,11,x,h(x>0?37:-37,z)+2.8,z,steel)}

// Recognizable skatepark architecture: curved side transitions and raised decks.
for(const side of [-1,1]){
  for(const zc of [-72,-12,50]){
    const xBase=side*30;
    // Transition ribs follow the same heightfield used by ball physics.
    for(let z=zc-13;z<=zc+13;z+=2.6){
      const x1=side*30,x2=side*36;
      const y1=h(x1,z),y2=h(x2,z);
      const dx=x2-x1,dy=y2-y1;
      const rib=B.MeshBuilder.CreateBox('curved ramp rib',{width:Math.hypot(dx,dy),height:.23,depth:.20},scene);
      rib.position.set((x1+x2)/2,(y1+y2)/2-.20,z);
      rib.rotation.z=Math.atan2(dy,dx);
      rib.material=dark;
    }
    for(let z=zc-12;z<=zc+12;z+=6){
      box('side framing',.45,3.0,.45,side*37,h(side*37,z)-1.3,z,dark);
    }
    box('quarter pipe deck',6,.55,27,side*40,h(side*37,zc)+1.3,zc,wood);
    box('steel deck coping',.26,.22,27,side*36.7,h(side*37,zc)+1.7,zc,steel);
  }
}
// Low wooden funboxes on the outer lanes; the central gravity run remains clear.
for(const [fx,fz] of [[-23,-45],[23,12],[-23,67]]){
  const y=h(fx,fz);
  box('funbox deck',8,.5,7,fx,y+1.7,fz,wood);
  for(const dx of [-3.5,3.5])for(const dz of [-2.9,2.9])
    box('funbox support',.45,3,.45,fx+dx,y+.15,fz+dz,dark);
  box('funbox metal edge',8,.15,.2,fx,y+2.02,fz+3.4,steel);
}
for(let z=-105;z<=105;z+=27){for(let x of [-43,43])box('timber pillar',1.5,36,1.5,x,18,z,dark);box('roof joist',90,.75,.8,0,52,z,dark)}
for(let z=-95;z<=95;z+=38)for(let x of [-25,0,25]){const lamp=new B.PointLight('warm lamp',new B.Vector3(x,47,z),scene);lamp.diffuse=new B.Color3(1,.83,.61);lamp.intensity=.23;lamp.range=48}
ball=B.MeshBuilder.CreateSphere('bowling ball',{diameter:2.9,segments:24},scene);ball.material=blue;const stripe=B.MeshBuilder.CreateTorus('ball stripe',{diameter:2.9,thickness:.11,tessellation:40},scene);stripe.parent=ball;stripe.material=gold;stripe.rotation.x=.55;
ring=B.MeshBuilder.CreateTorus('pin zone',{diameter:11,thickness:.16,tessellation:48},scene);ring.rotation.x=Math.PI/2;ring.material=gold;
for(let r=0;r<4;r++)for(let k=0;k<=r;k++){const node=new B.TransformNode('pin',scene);const body=B.MeshBuilder.CreateCylinder('body',{height:2,diameterTop:.47,diameterBottom:.8,tessellation:12},scene);body.parent=node;body.position.y=1;body.material=white;const head=B.MeshBuilder.CreateSphere('head',{diameter:.65,segments:10},scene);head.parent=node;head.position.y=2.12;head.material=white;const band=B.MeshBuilder.CreateCylinder('band',{height:.16,diameter:.55,tessellation:12},scene);band.parent=node;band.position.y=1.72;band.material=red;pins.push({node,dx:(k-r/2)*1.4,dz:r*1.25,down:false,fall:0,dxv:0,dzv:0})}
window.addEventListener('resize',()=>engine.resize());new ResizeObserver(()=>engine.resize()).observe(canvas);engine.runRenderLoop(tick);reset()}
function reset(){const starts=[[-2,-99],[12,-86],[-13,-72],[7,-58],[-12,-43],[12,-28],[-10,-12],[11,5]],ends=[[0,-39],[-11,-20],[11,-5],[-7,15],[12,35],[-10,54],[2,76],[0,96]];start=starts[(level-1)%starts.length];const valid=ends.filter(e=>e[1]>start[1]+42&&e[1]<start[1]+96);goal=valid[(level*3)%valid.length]||ends[ends.length-1];px=start[0];pz=start[1];vx=vz=steer=steerSmooth=cooldown=runTime=0;ball.position.set(px,h(px,pz)+1.5,pz);ball.rotation.set(0,0,0);ring.position.set(goal[0],h(...goal)+.18,goal[1]);for(const p of pins){p.down=false;p.fall=0;p.dxv=p.dzv=0;p.node.rotation.set(0,0,0);p.node.position.set(goal[0]+p.dx,h(goal[0]+p.dx,goal[1]+p.dz),goal[1]+p.dz)}$('level').textContent='LEVEL '+level;$('score').textContent='0 / 10 PINS';$('speed').textContent='0 km/h';$('boost').textContent='READY';count.textContent=''}
function startRun(first){reset();screen.hidden=true;phase=first?'intro':'countdown';timer=0;camera.position.set(goal[0],h(...goal)+12,goal[1]+17);camera.setTarget(new B.Vector3(goal[0],h(...goal)+1,goal[1]))}
function results(){phase='results';screen.hidden=false;const n=pins.filter(p=>p.down).length;screen.innerHTML='<small>LEVEL '+level+'</small><h1>'+(n===10?'STRIKE!':n+' PINS DOWN')+'</h1><p>Same skatepark, new challenge. Improve your line or roll somewhere new.</p><button id="next">NEXT LEVEL</button><button id="again">RETRY LEVEL</button>';$('next').onclick=()=>{level++;startRun(false)};$('again').onclick=()=>startRun(false)}
function follow(dt){const speed=Math.hypot(vx,vz),cz=pz-13-speed*.13,cx=px-clamp(vx*.12,-3,3),dest=new B.Vector3(cx,h(clamp(cx,-37,37),clamp(cz,-109,109))+6.5+speed*.03,cz);camera.position=B.Vector3.Lerp(camera.position,dest,1-Math.exp(-4*dt));camLook=B.Vector3.Lerp(camLook,new B.Vector3(px,ball.position.y+1.6,pz+9),1-Math.exp(-6*dt));camera.setTarget(camLook)}
function tick(){if(!document.contains(canvas)){engine.stopRenderLoop();engine.dispose();return}const now=performance.now(),dt=Math.min(.035,(now-last)/1000);last=now;if(phase==='intro'){timer+=dt;const t=clamp(timer/2.6,0,1),e=t*t*(3-2*t),x=goal[0]+(start[0]-goal[0])*e,z=goal[1]+16+(start[1]-goal[1]-28)*e;camera.position=B.Vector3.Lerp(camera.position,new B.Vector3(x,h(x,z)+13+7*Math.sin(t*Math.PI),z),.12);camera.setTarget(new B.Vector3(goal[0]+(start[0]-goal[0])*e,h(x,z)+2,goal[1]+(start[1]-goal[1])*e));if(timer>2.8){phase='countdown';timer=0}}else if(phase==='countdown'){timer+=dt;count.textContent=timer<.7?'3':timer<1.4?'2':timer<2.1?'1':'GO!';follow(dt);if(timer>2.65){phase='run';timer=0;count.textContent=''}}else if(phase==='run'){runTime+=dt;cooldown=Math.max(0,cooldown-dt);$('boost').textContent=cooldown?'WAIT':'READY';steerSmooth+=(steer-steerSmooth)*Math.min(1,dt*8);const dx=(h(px+.3,pz)-h(px-.3,pz))/.6,dz=(h(px,pz+.3)-h(px,pz-.3))/.6;vx+=(-dx*30+steerSmooth*(12+Math.min(Math.abs(vz)*.18,5)))*dt;vz+=-dz*30*dt;vx*=Math.exp(-.27*dt);vz*=Math.exp(-.27*dt);let speed=Math.hypot(vx,vz);if(speed>38){vx*=38/speed;vz*=38/speed;speed=38}px+=vx*dt;pz+=vz*dt;if(px>35){px=35;vx=-Math.abs(vx)*.5}if(px< -35){px=-35;vx=Math.abs(vx)*.5}pz=clamp(pz,-109,109);ball.position.set(px,h(px,pz)+1.5,pz);ball.rotation.x+=vz*dt/1.45;ball.rotation.z-=vx*dt/1.45;for(const p of pins){if(!p.down&&Math.hypot(px-goal[0]-p.dx,pz-goal[1]-p.dz)<2.25){p.down=true;p.fall=.01;p.dxv=vx*.25+(Math.random()-.5)*4;p.dzv=vz*.25+3;for(const q of pins)if(!q.down&&Math.hypot(q.dx-p.dx,q.dz-p.dz)<1.9&&Math.random()<.48){q.down=true;q.fall=.01;q.dxv=p.dxv+(Math.random()-.5)*4;q.dzv=p.dzv+3}}if(p.down){p.fall+=dt;p.node.rotation.z=Math.min(1.5,p.fall*3.4);p.node.position.x+=p.dxv*dt*.5;p.node.position.z+=p.dzv*dt*.5}}const n=pins.filter(p=>p.down).length;$('score').textContent=n+' / 10 PINS';$('speed').textContent=Math.round(speed*3.6)+' km/h';follow(dt);if(n===10||pz>goal[1]+13||runTime>35){phase='ending';timer=0}}else if(phase==='ending'){timer+=dt;follow(dt);if(timer>1.2)results()}scene.render()}
play.onclick=()=>phase==='menu'?startRun(true):boot();$('retry').onclick=()=>{if(scene)startRun(false)};
canvas.addEventListener('pointerdown',e=>{if(phase!=='run')return;pointer=e.pointerId;downX=e.clientX;downY=e.clientY;downTime=performance.now();moved=false;steer=0;canvas.setPointerCapture(e.pointerId);e.preventDefault()});
canvas.addEventListener('pointermove',e=>{if(e.pointerId!==pointer)return;const dx=e.clientX-downX,dy=e.clientY-downY;if(Math.hypot(dx,dy)>11)moved=true;steer=moved?clamp(dx/70,-1,1):0;$('steer').style.opacity=moved?'1':'0';$('steer').firstElementChild.style.left=(50+steer*43)+'%';e.preventDefault()});
canvas.addEventListener('pointerup',e=>{if(e.pointerId!==pointer)return;if(!moved&&performance.now()-downTime<380&&cooldown<=0&&phase==='run'){vz+=7.5;cooldown=2;count.textContent='BOOST';setTimeout(()=>{if(count.textContent==='BOOST')count.textContent=''},360)}pointer=null;steer=0;$('steer').style.opacity='0';e.preventDefault()});
canvas.addEventListener('pointercancel',()=>{pointer=null;steer=0;$('steer').style.opacity='0'});document.addEventListener('touchmove',e=>{if(e.target===canvas)e.preventDefault()},{passive:false});boot();
})();
</script></body></html>
